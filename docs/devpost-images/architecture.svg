<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" font-family="-apple-system, 'Inter', system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a6079"/>
    </marker>
    <linearGradient id="convener" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3a52"/>
      <stop offset="1" stop-color="#0d2438"/>
    </linearGradient>
    <linearGradient id="specialty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f5ee"/>
    </linearGradient>
    <linearGradient id="mcp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a8568"/>
      <stop offset="1" stop-color="#3a6a52"/>
    </linearGradient>
    <linearGradient id="supabase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a5a7c"/>
      <stop offset="1" stop-color="#1a3a52"/>
    </linearGradient>
    <linearGradient id="ui" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7e8"/>
      <stop offset="1" stop-color="#fdedd0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1080" fill="#f8f6f1"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#0d2438" letter-spacing="-0.4">The Council — Architecture</text>
  <text x="600" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="#4a6079" letter-spacing="0.04em">PEER A2A · SHARP-ON-MCP · LIVE FHIR · QUERYABLE AUDIT</text>

  <!-- ── 1. Prompt Opinion General Chat ───────────────────────── -->
  <g>
    <rect x="380" y="110" width="440" height="76" rx="8" fill="#ffffff" stroke="#e2dfd6" stroke-width="1.5"/>
    <text x="600" y="138" text-anchor="middle" font-size="13" fill="#8595a8" letter-spacing="0.18em" font-weight="600">PROMPT OPINION</text>
    <text x="600" y="166" text-anchor="middle" font-size="18" fill="#0d2438" font-weight="600">General Chat (clinician-facing)</text>
    <text x="600" y="178" text-anchor="middle" font-size="11" fill="#4a6079" font-style="italic">"Convene the Council on this patient."</text>
  </g>

  <!-- arrow PO → Convener -->
  <line x1="600" y1="190" x2="600" y2="226" stroke="#4a6079" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="612" y="212" font-size="11" fill="#4a6079">A2A SendMessage</text>

  <!-- ── 2. Convener ────────────────────────────────────────── -->
  <g>
    <rect x="380" y="232" width="440" height="84" rx="8" fill="url(#convener)"/>
    <text x="600" y="258" text-anchor="middle" font-size="11" fill="#8b9eaf" letter-spacing="0.18em" font-weight="600">A2A AGENT · GOOGLE ADK</text>
    <text x="600" y="284" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="700">Convener</text>
    <text x="600" y="304" text-anchor="middle" font-size="11" fill="#a8b8c8">Cloud Run · us-east1 · fire-and-forget · returns &lt;5s with live URL</text>
  </g>

  <!-- arrow Convener → specialty fan-out -->
  <line x1="600" y1="320" x2="600" y2="356" stroke="#4a6079" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="612" y="342" font-size="11" fill="#4a6079">Parallel A2A fan-out  (8 peers)</text>

  <!-- ── 3. Eight specialty agents (4×2 grid) ─────────────────── -->
  <g font-size="13" fill="#0d2438" font-weight="500">
    <!-- Row 1 -->
    <rect x="100"  y="370" width="232" height="64" rx="6" fill="url(#specialty)" stroke="#e2dfd6" stroke-width="1.2"/>
    <text x="216" y="392" text-anchor="middle">Cardiology</text>
    <text x="216" y="412" text-anchor="middle" font-size="10" fill="#8595a8">Cloud Run · us-west1</text>
    <text x="216" y="424" text-anchor="middle" font-size="10" fill="#8595a8" font-style="italic">AFib · anticoag · QT risk</text>

    <rect x="340"  y="370" width="232" height="64" rx="6" fill="url(#specialty)" stroke="#e2dfd6" stroke-width="1.2"/>
    <text x="456" y="392" text-anchor="middle">Oncology</text>
    <text x="456" y="412" text-anchor="middle" font-size="10" fill="#8595a8">Cloud Run · us-east4</text>
    <text x="456" y="424" text-anchor="middle" font-size="10" fill="#8595a8" font-style="italic">adjuvant therapy · DDIs</text>

    <rect x="580"  y="370" width="232" height="64" rx="6" fill="url(#specialty)" stroke="#e2dfd6" stroke-width="1.2"/>
    <text x="696" y="392" text-anchor="middle">Nephrology</text>
    <text x="696" y="412" text-anchor="middle" font-size="10" fill="#8595a8">Cloud Run · us-south1</text>
    <text x="696" y="424" text-anchor="middle" font-size="10" fill="#8595a8" font-style="italic">renal dosing · CKD</text>

    <rect x="820"  y="370" width="232" height="64" rx="6" fill="url(#specialty)" stroke="#e2dfd6" stroke-width="1.2"/>
    <text x="936" y="392" text-anchor="middle">Endocrinology</text>
    <text x="936" y="412" text-anchor="middle" font-size="10" fill="#8595a8">Cloud Run · europe-west1</text>
    <text x="936" y="424" text-anchor="middle" font-size="10" fill="#8595a8" font-style="italic">glycaemic targets · SGLT2/GLP1</text>

    <!-- Row 2 -->
    <rect x="100"  y="446" width="232" height="64" rx="6" fill="url(#specialty)" stroke="#e2dfd6" stroke-width="1.2"/>
    <text x="216" y="468" text-anchor="middle">Obstetrics &amp; MFM</text>
    <text x="216" y="488" text-anchor="middle" font-size="10" fill="#8595a8">Cloud Run · europe-west4</text>
    <text x="216" y="500" text-anchor="middle" font-size="10" fill="#8595a8" font-style="italic">pregnancy safety · VTE</text>

    <rect x="340"  y="446" width="232" height="64" rx="6" fill="url(#specialty)" stroke="#e2dfd6" stroke-width="1.2"/>
    <text x="456" y="468" text-anchor="middle">Developmental Peds</text>
    <text x="456" y="488" text-anchor="middle" font-size="10" fill="#8595a8">Cloud Run · us-east5</text>
    <text x="456" y="500" text-anchor="middle" font-size="10" fill="#8595a8" font-style="italic">syndromic · peds dosing</text>

    <rect x="580"  y="446" width="232" height="64" rx="6" fill="url(#specialty)" stroke="#e2dfd6" stroke-width="1.2"/>
    <text x="696" y="468" text-anchor="middle">Psychiatry</text>
    <text x="696" y="488" text-anchor="middle" font-size="10" fill="#8595a8">Cloud Run · asia-northeast1</text>
    <text x="696" y="500" text-anchor="middle" font-size="10" fill="#8595a8" font-style="italic">psychotropic interactions</text>

    <rect x="820"  y="446" width="232" height="64" rx="6" fill="url(#specialty)" stroke="#e2dfd6" stroke-width="1.2"/>
    <text x="936" y="468" text-anchor="middle">Anaesthesia &amp; Periop</text>
    <text x="936" y="488" text-anchor="middle" font-size="10" fill="#8595a8">Cloud Run · asia-southeast1</text>
    <text x="936" y="488" text-anchor="middle" font-size="10" fill="#8595a8"></text>
    <text x="936" y="500" text-anchor="middle" font-size="10" fill="#8595a8" font-style="italic">ASA risk · perioperative</text>
  </g>

  <!-- arrow specialties → MCP -->
  <line x1="600" y1="516" x2="600" y2="552" stroke="#4a6079" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="612" y="538" font-size="11" fill="#4a6079">Each specialty calls SHARP-on-MCP</text>

  <!-- ── 4. specialty-lens-mcp ───────────────────────────────── -->
  <g>
    <rect x="280" y="558" width="640" height="124" rx="8" fill="url(#mcp)"/>
    <text x="600" y="584" text-anchor="middle" font-size="11" fill="#cfe0d6" letter-spacing="0.18em" font-weight="600">MCP SERVER · TYPESCRIPT</text>
    <text x="600" y="610" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="700">specialty-lens-mcp</text>
    <text x="600" y="628" text-anchor="middle" font-size="11" fill="#cfe0d6">Cloud Run · us-central1</text>

    <line x1="320" y1="640" x2="880" y2="640" stroke="#6fa882" stroke-width="0.7" opacity="0.5"/>
    <text x="320" y="660" font-size="11" fill="#ffffff">⛨ SHARP middleware → real HTTP 403</text>
    <text x="320" y="675" font-size="11" fill="#ffffff">⌨ FHIR R4 client → live chart fetch</text>
    <text x="640" y="660" font-size="11" fill="#ffffff">🧠 Per-specialty clinical lens (Vertex/Gemini)</text>
    <text x="640" y="675" font-size="11" fill="#ffffff">⚖ 8 lens tools  +  2 concordance tools</text>
  </g>

  <!-- arrow MCP → Supabase -->
  <line x1="600" y1="686" x2="600" y2="722" stroke="#4a6079" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="612" y="708" font-size="11" fill="#4a6079">audit + plan writes</text>

  <!-- ── 5. Supabase ─────────────────────────────────────────── -->
  <g>
    <rect x="280" y="728" width="640" height="120" rx="8" fill="url(#supabase)"/>
    <text x="600" y="754" text-anchor="middle" font-size="11" fill="#a8c0d4" letter-spacing="0.18em" font-weight="600">POSTGRES + REALTIME</text>
    <text x="600" y="780" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="700">Supabase</text>

    <line x1="320" y1="794" x2="880" y2="794" stroke="#4a6f8c" stroke-width="0.7" opacity="0.5"/>
    <text x="320" y="813" font-size="11" fill="#ffffff">• audit_events</text>
    <text x="320" y="830" font-size="11" fill="#ffffff">• agent_messages</text>
    <text x="640" y="813" font-size="11" fill="#ffffff">• mcp_tool_calls</text>
    <text x="640" y="830" font-size="11" fill="#ffffff">• convening_sessions  (plan_artifact JSONB)</text>
  </g>

  <!-- arrow Supabase → UI -->
  <line x1="600" y1="852" x2="600" y2="888" stroke="#4a6079" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="612" y="874" font-size="11" fill="#4a6079">Supabase Realtime publication</text>

  <!-- ── 6. convene-ui ───────────────────────────────────────── -->
  <g>
    <rect x="280" y="894" width="640" height="100" rx="8" fill="url(#ui)" stroke="#e2dfd6" stroke-width="1.2"/>
    <text x="600" y="920" text-anchor="middle" font-size="11" fill="#b07a1a" letter-spacing="0.18em" font-weight="600">CLINICIAN-FACING · STATIC SPA</text>
    <text x="600" y="946" text-anchor="middle" font-size="20" fill="#0d2438" font-weight="700">convene-ui</text>
    <text x="600" y="966" text-anchor="middle" font-size="11" fill="#4a6079">Hugging Face Spaces · live deliberation viewer</text>
    <text x="600" y="982" text-anchor="middle" font-size="11" fill="#4a6079" font-style="italic">Plan · Live Deliberation · Specialty Consults · Audit Log</text>
  </g>

  <!-- Footer -->
  <text x="600" y="1040" text-anchor="middle" font-size="11" fill="#8595a8" letter-spacing="0.06em">
    Every tool call carries a SHARP context.  Every reasoning step writes to a queryable audit trail.
  </text>
  <text x="600" y="1058" text-anchor="middle" font-size="11" fill="#8595a8" letter-spacing="0.06em">
    No mocks.  No fixtures.  Live FHIR R4.  10 listings on the Prompt Opinion marketplace.
  </text>
</svg>
